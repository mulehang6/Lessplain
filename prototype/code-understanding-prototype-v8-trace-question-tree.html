};
const uiState={activeFile:'controller',current:'A',view:'question',visited:new Set(['A','B','D','E','U']),expanded:new Set(['A','B','E','U']),trace:{},selectedNode:null};
Object.keys(frames).forEach(id=>uiState.trace[id]={running:false,index:-1});
function childrenOf(id){return Object.values(frames).filter(f=>f.parent===id&&uiState.visited.has(f.id))}
function roots(){return Object.values(frames).filter(f=>!f.parent&&uiState.visited.has(f.id))}
function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function syntax(s){let x=esc(s);x=x.replace(/(\"[^\"]*\")/g,'<span class="str">$1</span>').replace(/\b(internal|fun|private|val|if|return|data|class|var|by)\b/g,'<span class="kw">$1</span>').replace(/\b(true|false|null)\b/g,'<span class="kw">$1</span>').replace(/\b(String|Int|List|Conversation|RestoredDraft|AttachmentRef|AIAgentGraphStrategy|JewelSurface|AnimatedVisibility|Modifier)\b/g,'<span class="type">$1</span>').replace(/\b(createConversationFromEntry|requireConversation|requireEntry|canBranchFrom|branchFrom|save|switchActiveConversation|restoreDraftFor|findFor|restoreDraft|buildStreamingSingleRunStrategy|remember|mutableStateOf|clickable)\b/g,'<span class="fn">$1</span>');return x}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1700)}
function renderTree(){const el=document.getElementById('projectTree');el.innerHTML='<div class="tree-label">Project files</div>'+tree.map(r=>`<div class="row d${Math.min(r.depth,3)} ${r.weak?'weak':''} ${r.file===uiState.activeFile?'active':''}" ${r.file?`onclick="openFile('${r.file}')"`:''}><span>${r.kind==='folder'?'›':''}</span><span class="name"><span class="${r.kind==='folder'?'folder':r.kind==='rootfile'?'rootfile':'file'}">${r.kind==='folder'?'▣':r.kind==='rootfile'?'M':'K'}</span> ${r.name}</span><span class="desc">${r.desc}</span></div>`).join('')+'<button class="overview-btn" onclick="setView(\'project\')">⌘ 查看 Project Understanding Graph</button>'}
function renderQNode(f){const kids=childrenOf(f.id),open=uiState.expanded.has(f.id);return `<div class="qrow qi${Math.min(f.depth,2)} ${uiState.current===f.id?'active':''} ${f.stale?'stale':''}" onclick="selectFrame('${f.id}')"><span class="qbullet" onclick="event.stopPropagation();toggleQuestion('${f.id}')">${kids.length?(open?'▾':'▸'):'•'}</span><span>${esc(f.title)}</span><span class="qmeta">${f.stale?'stale':f.created}</span></div>${kids.length&&open?kids.map(renderQNode).join(''):''}`}
function renderQuestions(){document.getElementById('questionTree').innerHTML=roots().map(renderQNode).join('')||'<div class="qrow">暂无历史理解问题</div>'}
function currentFrame(){return frames[uiState.current]}
function traceState(){return uiState.trace[uiState.current]}
function runtimeLine(line){const f=currentFrame(),tr=traceState();if(!tr.running)return '';for(let i=0;i<=tr.index;i++){const nid=f.path[i],val=f.runtime[nid];if(val){const n=f.nodes.find(x=>x.id===nid);if(n&&n.f===uiState.activeFile&&n.l===line)return val}}return ''}
function lineTrace(line){const f=currentFrame(),tr=traceState();let hit=false,current=false;if(tr.running){for(let i=0;i<=tr.index;i++){const n=f.nodes.find(x=>x.id===f.path[i]);if(n&&n.f===uiState.activeFile&&n.l===line){hit=true;if(i===tr.index)current=true}}}return{hit,current}}
function renderEditor(){const f=files[uiState.activeFile],cf=currentFrame();document.getElementById('fileTab').textContent='K '+f.name;document.getElementById('rolebar').innerHTML='<b>'+f.name+'</b>'+f.role;const ann=cf.file===uiState.activeFile?cf.annotations:{};document.getElementById('editor').innerHTML=f.lines.map(([n,t])=>{const sem=ann[n]||'',run=runtimeLine(n),lt=lineTrace(n);return `<div id="line-${uiState.activeFile}-${n}" class="code-line ${(sem||run)?'has-inline':''} ${lt.current?'current':''}" onclick="selectCodeLine(${n})"><div class="ln">${n}</div><div class="src">${syntax(t)}</div>${(sem||run)?`<div class="inline ${run?'runtime':''}">${sem?esc(sem):''}${sem&&run?'<span class="sep">·</span>':''}${run?esc(run):''}</div>`:''}</div>`}).join('');renderTree()}
function node(id){return currentFrame().nodes.find(n=>n.id===id)}function ctr(n){return{x:n.x+75,y:n.y+31}}function edgePath(e){const a=ctr(node(e.a)),b=ctr(node(e.b)),dx=Math.max(45,Math.abs(b.x-a.x)*.45);return `M ${a.x} ${a.y} C ${a.x+(b.x>=a.x?dx:-dx)} ${a.y}, ${b.x-(b.x>=a.x?dx:-dx)} ${b.y}, ${b.x} ${b.y}`}function edgeMid(e){const a=ctr(node(e.a)),b=ctr(node(e.b));return{x:(a.x+b.x)/2,y:(a.y+b.y)/2-5}}
function edgeActive(e){const f=currentFrame(),tr=traceState();if(!tr.running)return false;const ai=f.path.indexOf(e.a),bi=f.path.indexOf(e.b);return ai>=0&&bi===ai+1&&bi<=tr.index}function nodeHit(id){const f=currentFrame(),tr=traceState();return tr.running&&f.path.indexOf(id)>=0&&f.path.indexOf(id)<=tr.index}function nodeCurrent(id){const f=currentFrame(),tr=traceState();return tr.running&&f.path[tr.index]===id}
function graphHtml(){const f=currentFrame(),tr=traceState();return `<div class="graph-card"><svg viewBox="0 0 390 520"><defs><marker id="arr" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 z" fill="#697482"/></marker><marker id="arrg" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 z" fill="#79c995"/></marker></defs>${f.edges.map(e=>{const m=edgeMid(e);return `<g><path d="${edgePath(e)}" class="edge ${edgeActive(e)?'active':''} ${e.reject?'reject':''}" marker-end="${edgeActive(e)?'url(#arrg)':'url(#arr)'}"/><text x="${m.x}" y="${m.y}" class="edge-label" text-anchor="middle">${esc(e.label)}</text></g>`}).join('')}${f.nodes.map(n=>`<g class="node ${n.side?'side':''} ${n.keyVar?'keyvar':''} ${nodeHit(n.id)?'hit':''} ${nodeCurrent(n.id)?'current':''}" onclick="openNode('${n.id}')"><rect x="${n.x}" y="${n.y}" width="150" height="62"/><text x="${n.x+10}" y="${n.y+20}" class="nt">${esc(n.t)}</text><text x="${n.x+10}" y="${n.y+38}" class="ns">${esc(n.s)}</text><text x="${n.x+10}" y="${n.y+54}" class="nf">${esc(files[n.f].name)}:${n.l}</text>${n.side?`<text x="${n.x+96}" y="${n.y+13}" class="side-badge">${esc(n.sideLabel)}</text>`:''}${tr.running&&nodeCurrent(n.id)&&f.runtime[n.id]?`<text x="${n.x+10}" y="${n.y+77}" class="runtime-label">${esc(f.runtime[n.id])}</text>`:''}</g>`).join('')}</svg><div class="legend"><span class="lg"><i></i>可能关系</span><span class="lg"><i class="run"></i>本次真实路径</span><span class="lg"><i class="var"></i>关键变量节点</span></div></div><div class="note">点图节点跳源码。紫色节点表示可继续追问；真实产品中追问发生在用户自己的 Agent，本原型点击节点只是在模拟 Agent 再调用插件 MCP。</div>`}
function projectHtml(){return `<div class="projectmap"><div class="cluster" style="left:18px;top:180px"><b>Desktop UI</b><p>desktopApp/chat + component<br>约 18 files</p><div class="evidence">目录 + 依赖</div></div><div class="cluster" style="left:210px;top:50px"><b>Session</b><p>shared/session + controller<br>约 12 files</p><div class="evidence">目录 + call/reference</div></div><div class="cluster" style="left:210px;top:198px"><b>Agent Runtime</b><p>shared/agent/koog + hooks<br>约 21 files</p><div class="evidence">调用聚类 + 类型</div></div><div class="cluster" style="left:210px;top:350px"><b>Persistence</b><p>SQLite / snapshot / migration<br>约 9 files</p><div class="evidence">目录 + shared models</div></div><div class="cluster unclear" style="left:18px;top:365px"><b>Cross-cutting / Unclear</b><p>结构证据不足<br>约 6 files</p><div class="evidence">保守展示</div></div><div class="mapline" style="left:145px;top:210px;width:105px;transform:rotate(-36deg)"></div><div class="mapline" style="left:145px;top:220px;width:95px;transform:rotate(2deg)"></div><div class="mapline" style="left:265px;top:130px;width:105px;transform:rotate(90deg)"></div></div><div class="note">一个节点对应一个语义区域，而不是一个文件。IDE 提供结构事实，Agent 在事实约束下聚合；结构混乱时允许 Unclear，不强行编造架构。</div>`}
function uiHtml(){return `<div class="ui-outline"><div class="fake-app"><div class="fake-sidebar"><div class="fakebtn">Home</div><div class="fakebtn mark">Session</div><div class="fakebtn">Tools</div><div class="fakebtn">Settings</div></div><div class="fake-main"><div style="font-size:12px;font-weight:650">Chat Workspace</div><div style="margin-top:14px;height:75px;border:1px solid #3e434c;border-radius:7px"></div><div style="margin-top:16px;height:190px;border:1px solid #3e434c;border-radius:7px"></div></div></div><div class="outline-note">区域级判断：你问的“左侧 Session 按钮”大概属于 navigation/sidebar。候选源码：WorkspacePanel.kt / Navigation*.kt。它不是精确 runtime mapping。</div></div>`}
function frameOriginHtml(f){
  if(!f.origin)return '';
  const of=frames[f.origin], pf=f.parent?frames[f.parent]:null;
  const same=f.origin===f.parent;
  return `<div class="frame-origin"><div><b>提问来源：</b>${esc(of.title)} · ${esc(f.anchorNodeId||'—')} · ${esc(f.sourceAnchor||'—')}${f.originTraceStep?` · Trace ${f.originTraceStep}`:''}</div><div class="relation"><b>问题树归属：</b>${pf?esc(pf.title):'顶层'}${same?'':' · 来源与归属不同'}</div></div>`;
}
function currentContextHtml(){
  const f=currentFrame(),tr=traceState();
  if(!tr.running||tr.index<0)return '';
  const nid=f.path[tr.index],n=f.nodes.find(x=>x.id===nid);
  if(!n)return '';
  return `<div class="context-strip">Agent 可通过 <code>get_understanding_context()</code> 读取：Frame ${esc(f.id)} · ${esc(n.t)} · ${esc(files[n.f].name)}:${n.l} · Trace ${tr.index+1}</div>`;
}
function renderWork(){const f=currentFrame(),tr=traceState(),work=document.getElementById('work');document.querySelectorAll('.headbtn').forEach(b=>b.classList.remove('active'));document.getElementById(uiState.view==='question'?'questionViewBtn':uiState.view==='project'?'projectViewBtn':'uiViewBtn').classList.add('active');if(uiState.view==='project'){work.innerHTML=`<div class="utop"><div class="utitle">Project Understanding Graph</div><div class="usub">次级视图，不替代 Project Tree。图仍和源码同时存在。</div></div><div class="view">${projectHtml()}</div>`;return}if(uiState.view==='ui'){work.innerHTML=`<div class="utop"><div class="utitle">UI 大致定位（实验性）</div><div class="usub">用于缺少通用 UI → Source 映射时的弱替代，只给区域级候选。</div></div><div class="view">${uiHtml()}</div>`;return}const stale=f.stale?'<div class="stale-banner">源码已变化：当前理解可能过期。旧状态保留，但不再当成当前事实。</div>':'';work.innerHTML=`${stale}<div class="utop"><div class="utitle">${esc(f.title)}</div><div class="usub">${esc(f.sub)}</div>${frameOriginHtml(f)}<div class="controls"><button class="btn primary" ${f.path.length?'':'disabled'} onclick="startTrace()">${tr.running?'重新运行 Trace':'运行真实 Trace'}</button><button class="btn" ${tr.running&&tr.index>0?'':'disabled'} onclick="stepTrace(-1)">上一步</button><button class="btn" ${tr.running&&tr.index<f.path.length-1?'':'disabled'} onclick="stepTrace(1)">下一步</button>${f.stale?'<button class="btn" onclick="reanalyze()">重新分析</button>':''}<span class="stepread">${tr.running?`${tr.index+1} / ${f.path.length}`:'未运行'}</span></div>${currentContextHtml()}</div><div class="view">${graphHtml()}</div>`}
function renderAll(){renderQuestions();renderEditor();renderWork()}
function jump(file,line){uiState.activeFile=file;renderEditor();requestAnimationFrame(()=>document.getElementById(`line-${file}-${line}`)?.scrollIntoView({behavior:'smooth',block:'center'}))}
function openFile(file){uiState.activeFile=file;renderEditor()}
function selectFrame(id){if(!frames[id])return;uiState.current=id;uiState.view=frames[id].view||'question';uiState.activeFile=frames[id].file;renderAll();jump(frames[id].file,frames[id].line)}
function toggleQuestion(id){if(uiState.expanded.has(id))uiState.expanded.delete(id);else uiState.expanded.add(id);renderQuestions()}
function toggleRoots(){const rs=roots();const all=rs.every(r=>uiState.expanded.has(r.id));rs.forEach(r=>all?uiState.expanded.delete(r.id):uiState.expanded.add(r.id));renderQuestions()}
function setView(v){uiState.view=v;renderWork()}
function openNode(id){const n=node(id);if(!n)return;uiState.selectedNode=id;jump(n.f,n.l);if(n.side){setTimeout(()=>{uiState.visited.add(n.side);uiState.expanded.add(uiState.current);uiState.current=n.side;uiState.activeFile=frames[n.side].file;uiState.view='question';renderAll();jump(frames[n.side].file,frames[n.side].line);toast('模拟：用户在外部 Agent 追问，Agent 再次调用插件 MCP')},280)}}
function selectCodeLine(line){const f=currentFrame();const match=f.nodes.find(n=>n.f===uiState.activeFile&&n.l===line);if(match){uiState.selectedNode=match.id;toast('源码位置已与图节点关联')}}
function startTrace(){const f=currentFrame();if(!f.path.length)return;const tr=traceState();tr.running=true;tr.index=0;uiState.view='question';renderAll();syncTrace();toast('模拟：Agent 直接调用 IDEA Debugger MCP，开始采集真实路径')}
function stepTrace(d){const f=currentFrame(),tr=traceState();if(!tr.running)return;tr.index=Math.max(0,Math.min(f.path.length-1,tr.index+d));renderAll();syncTrace()}
function syncTrace(){const f=currentFrame(),tr=traceState(),nid=f.path[tr.index],n=f.nodes.find(x=>x.id===nid);if(n)jump(n.f,n.l)}
function reanalyze(){currentFrame().stale=false;renderAll();toast('模拟：Agent 重新分析，当前 Frame 已刷新')}
function agentPushA(){uiState.visited.add('A');uiState.expanded.add('A');selectFrame('A');toast('模拟：External Agent → present_understanding(...)')}
function setTraceQuestionOrigin(){uiState.visited.add('B');uiState.expanded.add('A');uiState.expanded.add('B');uiState.current='B';uiState.activeFile='controller';uiState.view='question';const tr=uiState.trace['B'];tr.running=true;tr.index=1;renderAll();syncTrace()}
function agentAskTraceChild(){setTraceQuestionOrigin();setTimeout(()=>{uiState.visited.add('F');uiState.expanded.add('B');selectFrame('F');toast('同一 Trace step 产生的问题：依赖 B，因此缩进到 B 下')},420)}
function agentAskTraceSibling(){setTraceQuestionOrigin();setTimeout(()=>{uiState.visited.add('C');uiState.expanded.add('A');selectFrame('C');toast('同一 Trace step 产生的问题：不依赖 B，因此回到 A 下成为同级')},420)}
function agentAskRoot(){uiState.visited.add('E');uiState.expanded.add('E');selectFrame('E');toast('模拟：无从属关系，创建新的根问题')}
function sourceChanged(){['A','B','C'].forEach(id=>{if(frames[id])frames[id].stale=true});renderAll();toast('模拟：源码变化，相关历史理解被标记 stale')}
renderAll();
</script>
